<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ScreenAI - AI Resume Screener</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <link rel="stylesheet" href="styles.css">
</head>
<body class="bg-gray-950 text-white h-screen w-screen overflow-hidden relative font-sans">

    <canvas id="starfield" class="absolute inset-0 z-0"></canvas>
    <div class="nebula z-0"></div>

    <main class="relative z-10 flex h-full w-full bg-gray-900/60 backdrop-blur-md">

        <section class="flex flex-col w-[40%] p-8 overflow-y-auto border-r border-purple-500/20 shrink-0">
            
            <header class="mb-6">
                <p class="text-xs uppercase tracking-widest text-purple-400 font-bold mb-1">ScreenAI</p>
                <h1 class="text-2xl font-bold">Upload & Analyze</h1>
            </header>

            <input type="file" id="cv-upload" multiple accept=".pdf" class="hidden">
            
            <div id="browse-btn" class="flex flex-col items-center justify-center p-8 mb-6 border-2 border-dashed border-purple-500/40 rounded-xl bg-purple-500/10 hover:bg-purple-500/20 transition cursor-pointer">
                <i data-lucide="cloud-upload" class="w-8 h-8 text-purple-400 mb-3"></i>
                <p class="text-sm font-semibold text-gray-200">Click to upload PDF resumes</p>
                <p class="text-xs text-gray-400 mt-2">Max 10 files</p>
            </div>

            <div class="mb-6">
                <p id="file-count-label" class="text-xs uppercase tracking-widest text-gray-400 mb-3">Uploaded Files (0/10)</p>
                <div id="file-list-container" class="flex flex-col gap-2"></div>
            </div>

            <div class="flex flex-col flex-1 min-h-[150px]">
                <p class="text-xs uppercase tracking-widest text-gray-400 mb-3">Job Description</p>
                <textarea class="jd-textarea flex-1 w-full bg-gray-900/50 border border-gray-700 rounded-xl p-4 text-sm text-gray-300 resize-none focus:outline-none focus:border-purple-500 transition" placeholder="Paste role requirements, skills, and responsibilities here..."></textarea>
            </div>

            <button class="btn-analyse mt-6 w-full bg-purple-600 hover:bg-purple-500 text-white font-bold py-4 rounded-xl transition shadow-[0_0_15px_rgba(124,106,247,0.4)]">
                <span>✦ Analyse All CVs →</span>
            </button>

        </section>

        <section class="flex-1 flex flex-col p-8 overflow-y-auto">
            
            <header class="flex justify-between items-end mb-8">
                <div>
                    <p class="text-xs uppercase tracking-widest text-purple-400 font-bold mb-1">AI RESULTS</p>
                    <h2 class="text-2xl font-bold">Rankings</h2>
                </div>
                <div class="flex items-center gap-2 bg-green-500/10 border border-green-500/30 rounded-full px-3 py-1">
                    <div class="w-2 h-2 rounded-full bg-green-400 animate-pulse"></div>
                    <span class="text-xs text-green-400 font-semibold">Live</span>
                </div>
            </header>

            <div id="empty-state" class="flex-1 flex flex-col items-center justify-center text-center p-10">
                <i data-lucide="sparkles" class="w-12 h-12 text-purple-400 mb-4 opacity-80"></i>
                <p class="text-lg font-bold text-white mb-2">Awaiting Data</p>
                <p class="text-sm text-gray-400">Upload CVs and add a JD to see the AI magic happen.</p>
            </div>

            <div id="results-container" class="flex flex-col gap-4"></div>

        </section>
    </main>

    <script>
        lucide.createIcons();
        
        // Simplified Starfield Logic
        const canvas = document.getElementById('starfield');
        const ctx = canvas.getContext('2d');
        let stars = [];

        function resize() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
            // Calculate star density based on screen size
            stars = Array.from({ length: Math.floor(canvas.width * canvas.height / 3000) }, () => ({
                x: Math.random() * canvas.width,
                y: Math.random() * canvas.height,
                r: Math.random() * 1.2 + 0.3,
                phase: Math.random() * Math.PI * 2,
                speed: Math.random() * 1.5 + 0.5
            }));
        }

        function draw(time) {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            stars.forEach(s => {
                const opacity = 0.2 + 0.8 * (0.5 + 0.5 * Math.sin(s.phase + (time * 0.001) * s.speed));
                ctx.beginPath();
                ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2);
                ctx.fillStyle = `rgba(255,255,255,${opacity})`;
                ctx.fill();
            });
            requestAnimationFrame(draw);
        }

        window.addEventListener('resize', resize);
        resize();
        requestAnimationFrame(draw);
    </script>
    
    <script src="script.js"></script>
</body>
</html>
